name: 빌드 및 릴리스

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 버전 계산
        id: version
        run: |
          BASE=$(grep '^baseVersionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: 릴리스 APK 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK 이름 정리
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          DEST="TouchNotch-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 액션노치 ${{ steps.version.outputs.version }}
          body: |
            커밋 `${{ github.sha }}` 로 빌드한 APK 입니다.

            앱의 **업데이트 › 업데이트 확인**에서 바로 설치할 수 있습니다.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
